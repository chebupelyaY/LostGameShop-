<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Вход — LostGameShop</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header class="header">
            <div class="container header__inner">
                <a class="header__logo" href="index.html">
                    <img src="media/logo.svg" alt="Логотип">
                    <span>LostGameShop</span>
                </a>
                <div class="header__actions">
                    <a class="button button--ghost" href="index.html">На главную</a>
                    <a class="button button--primary" href="register.html">Регистрация</a>
                </div>
            </div>
        </header>
        <main class="auth">
            <div class="container">
                <section class="auth__card">
                    <h1 class="auth__title">С возвращением</h1>
                    <p class="auth__text">Войдите, чтобы открыть библиотеку и историю покупок.</p>
                    <form class="form" action="#" method="post">
                        <label class="form__field">
                            <span class="form__label">E-mail</span>
                            <input class="form__input" type="email" name="email" placeholder="you@example.com" required>
                        </label>
                        <label class="form__field">
                            <span class="form__label">Пароль</span>
                            <input class="form__input" type="password" name="password" placeholder="Введите пароль" required>
                        </label>
                        <button class="button button--primary button--wide" type="submit">Войти</button>
                    </form>
                    <p class="auth__text" style="margin-top:18px;margin-bottom:0">Нет аккаунта? <a class="auth__link" href="register.html">Зарегистрироваться</a>
                    </p>
                </section>
            </div>
        </main>
    </body>
</html>
